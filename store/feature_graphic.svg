<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b2e"/>
      <stop offset="1" stop-color="#242636"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b4fe"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- Icon art, same geometry as assets/icon/icon.svg -->
  <g transform="translate(70 70) scale(0.35)">
    <rect x="222" y="560" width="160" height="220" rx="40" fill="url(#bar)" opacity="0.55"/>
    <rect x="432" y="440" width="160" height="340" rx="40" fill="url(#bar)" opacity="0.8"/>
    <rect x="642" y="320" width="160" height="460" rx="40" fill="url(#bar)"/>
    <path d="M 250 330 L 345 425 L 540 230" fill="none" stroke="#4ade80"
          stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Roboto, 'Noto Sans', 'DejaVu Sans', sans-serif">
    <text x="440" y="215" fill="#e2e2f0" font-size="84" font-weight="700">GoalStat</text>
    <text x="443" y="275" fill="#9a9ab0" font-size="30">Daily, weekly &amp; monthly goals.</text>
    <text x="443" y="315" fill="#9a9ab0" font-size="30">Know if you're on pace.</text>
    <g font-size="22" font-weight="600">
      <rect x="443" y="352" width="150" height="38" rx="19" fill="#4ade80" fill-opacity="0.15"/>
      <text x="518" y="378" fill="#4ade80" text-anchor="middle">On target</text>
      <rect x="605" y="352" width="180" height="38" rx="19" fill="#fb923c" fill-opacity="0.15"/>
      <text x="695" y="378" fill="#fb923c" text-anchor="middle">Behind pace</text>
      <rect x="797" y="352" width="170" height="38" rx="19" fill="#c084fc" fill-opacity="0.15"/>
      <text x="882" y="378" fill="#c084fc" text-anchor="middle">7-day streak</text>
    </g>
  </g>
</svg>
