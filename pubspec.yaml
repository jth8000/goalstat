name: goalstat
description: "GoalStat - Personal goal tracking with dashboards and analytics."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.3
  path: ^1.9.0
  fl_chart: ^0.71.0
  intl: ^0.20.2
  share_plus: ^11.0.0
  csv: ^6.0.0
  table_calendar: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Regenerate launcher icons after editing assets/icon/*.svg (render to PNG first):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1a1b2e"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # The foreground PNG already keeps the art inside the safe zone.
  adaptive_icon_foreground_inset: 0
